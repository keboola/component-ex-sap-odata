[project]
name = "component-ex-sap-odata"
version = "0.2.1"
description = "SAP OData Extractor for Keboola - supports both OData V2 and V4 protocols"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "keboola-component>=1.6.10",
    "keboola-csvwriter>=1.0.1",
    "keboola-http-client>=0.2.0",
    "pydantic>=2.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "freezegun>=1.5.0",
    "responses>=0.25.0",
    "respx>=0.21.0",
    "httpx>=0.24.0",
    "ty>=0.0.1a6",
    "pre-commit>=3.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.ty.environment]
extra-paths = ["src"]
